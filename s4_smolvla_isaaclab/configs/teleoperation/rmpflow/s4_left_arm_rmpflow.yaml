api_version: 1.0
joint_limit_buffers: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03]

rmp_params:
  cspace_target_rmp:
    metric_scalar: 5.0
    position_gain: 25.0
    damping_gain: 15.0
    robust_position_term_thresh: 0.5
    inertia: 1.0
  cspace_trajectory_rmp:
    p_gain: 80.0
    d_gain: 10.0
    ff_gain: 0.25
    weight: 50.0
  cspace_affine_rmp:
    final_handover_time_std_dev: 0.25
    weight: 2000.0
  joint_limit_rmp:
    metric_scalar: 1000.0
    metric_length_scale: 0.01
    metric_exploder_eps: 0.001
    metric_velocity_gate_length_scale: 0.01
    accel_damper_gain: 200.0
    accel_potential_gain: 1.0
    accel_potential_exploder_length_scale: 0.1
    accel_potential_exploder_eps: 0.01
  joint_velocity_cap_rmp:
    max_velocity: 3.0
    velocity_damping_region: 0.8
    damping_gain: 250.0
    metric_weight: 100.0
  target_rmp:
    accel_p_gain: 340.0
    accel_d_gain: 75.0
    accel_norm_eps: 0.05
    metric_alpha_length_scale: 0.04
    min_metric_alpha: 0.02
    max_metric_scalar: 10000.0
    min_metric_scalar: 2500.0
    proximity_metric_boost_scalar: 20.0
    proximity_metric_boost_length_scale: 0.02
    accept_user_weights: false
  axis_target_rmp:
    accel_p_gain: 450.0
    accel_d_gain: 65.0
    metric_scalar: 60.0
    proximity_metric_boost_scalar: 7000.0
    proximity_metric_boost_length_scale: 0.08
    accept_user_weights: false
  collision_rmp:
    damping_gain: 50.0
    damping_std_dev: 0.04
    damping_robustness_eps: 0.01
    damping_velocity_gate_length_scale: 0.01
    repulsion_gain: 800.0
    repulsion_std_dev: 0.03
    metric_modulation_radius: 0.35
    metric_scalar: 100.0
    metric_exploder_std_dev: 0.05
    metric_exploder_eps: 0.001
  damping_rmp:
    accel_d_gain: 55.0
    metric_scalar: 80.0
    inertia: 60.0

canonical_resolve:
  max_acceleration_norm: 180.0
  projection_tolerance: 0.01
  verbose: false

# Coarse torso avoidance only. The opposite arm is intentionally absent.
body_cylinders:
  - name: torso
    pt1: [-0.08, 0.0, -0.12]
    pt2: [-0.08, 0.0, 0.36]
    radius: 0.16

body_collision_controllers:
  - {name: left_elbow_link, radius: 0.055}
  - {name: left_wrist_roll_link, radius: 0.050}
  - {name: left_wrist_yaw_link, radius: 0.045}
