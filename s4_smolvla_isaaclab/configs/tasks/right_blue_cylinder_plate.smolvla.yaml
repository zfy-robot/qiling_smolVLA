# SmolVLA training config for right_blue_cylinder_plate.

task: right_blue_cylinder_plate
robot: S4-UpperBody

dataset: s4_right_blue_cylinder_plate_v1
dataset_root: ${S4_DATA_ROOT}/lerobot_data
output_dir: ${S4_OUTPUT_ROOT}/train/smolvla_s4_right_v1

steps: 20000
batch_size: 4
num_workers: 0
device: cuda
seed: 42
save_freq: 2000
resume: false

chunk_size: 50
n_obs_steps: 1
max_state_dim: 50
max_action_dim: 32
resize_imgs_with_padding: [512, 512]

freeze_vision_encoder: true
train_expert_only: true
train_state_proj: true
load_vlm_weights: true
vlm_model_name: ${SMOLVLA_MODEL_ROOT}/HuggingFaceTB/SmolVLM2-500M-Video-Instruct

optimizer_lr: 1.0e-5
optimizer_weight_decay: 0.0001
optimizer_grad_clip_norm: 10.0
