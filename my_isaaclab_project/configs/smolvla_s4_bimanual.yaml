# Local SmolVLA training config for S4 bimanual red/blue plate task.
# This file is owned by my_isaaclab_project. BenchHub configs are reference only.

task: s4_bimanual_red_blue_plate
robot: S4-Bimanual

dataset: s4_bimanual_red_blue_plate_v0
dataset_root: /home/zfy/smolVLA/datasets/lerobot_data
output_dir: /home/zfy/smolVLA/outputs/train/smolvla_s4_bimanual_v0

steps: 3000
batch_size: 4
num_workers: 4
seed: 42
save_freq: 1000
resume: false

chunk_size: 50
n_obs_steps: 1
max_state_dim: 50
max_action_dim: 32
resize_imgs_with_padding: [512, 512]

freeze_vision_encoder: true
train_expert_only: true
train_state_proj: true
load_vlm_weights: true
vlm_model_name: /home/zfy/.cache/modelscope/hub/models/HuggingFaceTB/SmolVLM2-500M-Video-Instruct

optimizer_lr: 1.0e-5
optimizer_weight_decay: 0.0001
optimizer_grad_clip_norm: 10.0

